[project]
name = "auth-gateway"
version = "0.1.0"
description = "External Auth Gateway for Odoo Cloud with Google Workspace & Telegram integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1,<2",
    "openpyxl>=3.1.5,<4",
    "jsonschema>=4.23,<5",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "sqlalchemy==2.0.36",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "httpx==0.28.1",
    "cryptography==44.0.0",
    "google-auth==2.37.0",
    "qrcode[pil]==8.0",
    "python-multipart==0.0.20",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "requests==2.32.3",
    "tzdata==2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.8.6",
    "respx==0.22.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
