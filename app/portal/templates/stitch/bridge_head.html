<meta name="csrf-token" content="{{ csrf_token or '' }}">
<script>
  try {
    const url = new URL(location.href);
    const requestedTheme = url.searchParams.get("theme");
    const saved = localStorage.getItem("gateway_theme");
    const theme = requestedTheme === "light" || requestedTheme === "dark" ? requestedTheme
      : saved === "light" || saved === "dark" ? saved
      : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.stitchTheme = theme;
    document.documentElement.style.colorScheme = theme;
  } catch {}
</script>

  .stitch-theme-switch[aria-checked="true"] .stitch-theme-track { border-color: #365066; background: #142b3e; color: #b4c5d5; }
