<meta name="csrf-token" content="{{ csrf_token or '' }}">
<script>
  try {
    const url = new URL(location.href);
    const requestedTheme = url.searchParams.get("theme");
    if (requestedTheme === "light" || requestedTheme === "dark") {
      localStorage.setItem("gateway_theme", requestedTheme);
    }
    const saved = localStorage.getItem("gateway_theme");
    const theme = saved === "light" || saved === "dark"
      ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    if (!url.searchParams.has("theme") && url.pathname !== "/auth/login" &&
        theme !== document.documentElement.dataset.stitchTheme) {
      url.searchParams.set("theme", theme);
      location.replace(url);
    }
  } catch {}
</script>
<style>
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid #0f766e; outline-offset: 3px; }
  [data-stitch-app][data-enabled="false"] > :last-child { opacity: .35; }
  [data-stitch-feedback] { margin: 12px auto; width: min(90%, 1040px); padding: 12px 16px; border: 1px solid #0f766e; border-radius: 6px; background: #edfdf8; color: #005c55; font: 14px/1.5 sans-serif; }
  [data-stitch-feedback][data-error] { border-color: #b91c1c; background: #fff1f2; color: #991b1b; }
  #odooLoginForm ~ [role="alert"], [role="alert"].bg-red-50 { padding: 12px; margin-bottom: 20px; border: 1px solid #fca5a5; border-radius: 6px; background: #fef2f2; color: #991b1b; }
  @media (max-width: 639px) {
    [data-stitch-service-heading],
    [data-stitch-service-heading] > div { flex-wrap: wrap; min-width: 0; max-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
