<div class="telegram-link" data-telegram-link {% if not preview_qr or not verification_page %}hidden{% endif %}>
  <p>Quét mã QR bằng điện thoại để tiếp tục.</p>
  <img class="telegram-qr" alt="Mã QR mở Telegram" {% if preview_qr and verification_page %}src="{{ preview_qr }}"{% endif %}>
  <a class="btn btn-secondary" target="_blank" rel="noopener" {% if preview_qr and verification_page %}href="https://example.com/telegram-demo"{% endif %}>Mở Telegram</a>
</div>
<p class="muted telegram-progress" data-telegram-progress role="status" hidden></p>
