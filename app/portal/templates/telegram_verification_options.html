<div style="display: flex; flex-direction: column; gap: 0.75rem;">
  <form action="/connections/telegram/verify-browser" method="POST" target="_blank" rel="noopener" style="margin: 0;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="btn btn-primary btn-block" style="justify-content: flex-start; padding: 0.75rem 1rem;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0;">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
      <div style="text-align: left; margin-left: 0.5rem;">
        <div style="font-weight: 600; font-size: 0.875rem;">Dùng Telegram Web</div>
        <div style="font-size: 0.75rem; opacity: 0.85; font-weight: normal;">Nhận mã và xác thực trực tiếp trên trình duyệt</div>
      </div>
    </button>
  </form>

  {% if telegram_web_configured %}
  <form action="/connections/telegram/verify" method="POST" target="_blank" rel="noopener" style="margin: 0;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="btn btn-secondary btn-block" style="justify-content: flex-start; padding: 0.75rem 1rem;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0; color: #0088cc;">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
      </svg>
      <div style="text-align: left; margin-left: 0.5rem;">
        <div style="font-weight: 600; font-size: 0.875rem; color: var(--text-main);">Mở ứng dụng Telegram</div>
        <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: normal;">Chuyển tiếp đến ứng dụng Telegram trên thiết bị</div>
      </div>
    </button>
  </form>
  <p class="help-text" style="margin-top: 0.25rem;">
    💡 Mẹo: Bạn cũng có thể chọn quét mã QR trực tiếp trên màn hình Telegram để liên kết nhanh mà không cần gõ lệnh.
  </p>
  {% endif %}
</div>
